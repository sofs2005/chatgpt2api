# Privoxy 配置：把 WARP 的 SOCKS5 出口转成 HTTP 代理，且只转发上游流量。
#
# 为什么需要这一层：Cloudflare 会把「数据中心 IP 直连 chatgpt.com」视为高风险信号，
# 让出口走 WARP 能显著降低挑战率。但 WARP 只提供 SOCKS5，而 Go 的 http.Transport
# 需要 HTTP 代理，因此中间加一层协议转换。
#
# 路由原则：只有 OpenAI 系域名绕进 WARP。管理流量、更新检查、镜像拉取直连，
# 避免无收益的绕行与额外的出口争用。
listen-address  0.0.0.0:8118

# 顺序很重要：forward 规则是「按顺序检查，最后一条匹配的生效」（last match wins），
# 所以兜底的 `forward / .` 必须写在最前面，具体规则写在后面才能覆盖它。
# 之前把兜底放在最后，导致下面 5 条 SOCKS 规则全部被它压掉，WARP 静默失效。
#
# 其余流量直连（兜底，必须在前）。
forward / .

# 上游走 WARP。socks5t 后缀表示域名交给代理解析（远端 DNS）：
# 本地解析会暴露真实 DNS 出口，也可能拿到被污染的结果。
#
# 语法是三个参数：<pattern> <socks代理> <http父代理>。
# 第三个参数 "." 表示「不再经 HTTP 父代理」，不能省略——省掉后 privoxy 会把
# socks 代理地址错当成 HTTP 父代理，启动时报
# "Wrong number of parameters for forward-socks5t" 并静默回落到直连。
#
# 主机名要带前导点（.chatgpt.com）：裸主机名只匹配该主机本身，
# 不匹配 auth.openai.com / api.openai.com 这类子域，会直接漏出去直连。
forward-socks5t .chatgpt.com           warp-proxy:1080 .
forward-socks5t .openai.com            warp-proxy:1080 .
forward-socks5t .oaistatic.com         warp-proxy:1080 .
forward-socks5t .oaiusercontent.com    warp-proxy:1080 .
forward-socks5t .chatgpt.livekit.cloud warp-proxy:1080 .

# 不做内容过滤，本容器只负责协议转换与路由。
toggle 0
keep-alive-timeout 300
# WARP 出口偶发慢响应，放宽超时，避免长任务被误判为失败。
socket-timeout 300
